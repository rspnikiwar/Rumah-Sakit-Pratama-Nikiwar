---
layout: default
---
<main id="isi" class="article-main">
  <article class="program-article">
    <p class="eyebrow">Kabar dan informasi{% if page.example %} <span aria-hidden="true">•</span> <span class="review-label">Contoh — periksa sebelum dipublikasikan</span>{% endif %}</p>
    <h1>{{ page.title | escape }}</h1>
    <time class="news-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d-%m-%Y" }}</time>
    <div class="article-body">{{ content }}</div>
    <p><a class="button" href="{{ '/artikel/' | relative_url }}">Lihat semua artikel</a></p>
  </article>
</main>
